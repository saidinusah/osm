<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gyeme Maps - Ghana</title>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }

        .overlay-panel {
            position: absolute;
            top: 16px;
            left: 16px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            padding: 16px;
            z-index: 1000;
            max-width: 340px;
        }

        .overlay-panel h1 {
            font-size: 18px;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .overlay-panel p {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }

        .control-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #eee;
        }

        .control-section label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
        }

        .search-container {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #10b981;
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1001;
            display: none;
        }

        .search-results.visible {
            display: block;
        }

        .search-result-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #f3f4f6;
        }

        .search-result-item:hover {
            background: #f3f4f6;
        }

        .search-result-item .result-name {
            font-weight: 500;
            color: #1a1a1a;
        }

        .search-result-item .result-type {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            font-weight: normal;
            cursor: pointer;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #10b981;
            color: white;
        }

        .btn-primary:hover {
            background: #059669;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .btn-danger {
            background: #fee2e2;
            color: #dc2626;
        }

        .btn-danger:hover {
            background: #fecaca;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .status-vector {
            background: #d1fae5;
            color: #065f46;
        }

        .info-panel {
            position: absolute;
            bottom: 24px;
            left: 16px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            padding: 12px 16px;
            z-index: 1000;
            font-size: 12px;
            color: #666;
        }

        .info-panel strong {
            color: #333;
        }

        .route-panel {
            position: absolute;
            top: 16px;
            right: 60px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
            padding: 16px;
            z-index: 1000;
            width: 300px;
            display: none;
        }

        .route-panel.visible {
            display: block;
        }

        .route-panel h3 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        .route-panel input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            margin-bottom: 8px;
        }

        .route-panel input:focus {
            border-color: #3b82f6;
        }

        .route-info {
            margin-top: 12px;
            padding: 10px;
            background: #f0f9ff;
            border-radius: 6px;
            font-size: 12px;
            color: #1e40af;
            display: none;
        }

        .route-info.visible {
            display: block;
        }

        .maplibregl-popup-content {
            padding: 16px;
            border-radius: 8px;
        }

        .station-popup h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #1a1a1a;
        }

        .station-popup p {
            margin: 4px 0;
            font-size: 12px;
            color: #666;
        }

        .station-popup .connectors {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .station-popup .connector-badge {
            padding: 2px 6px;
            background: #e5e7eb;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .route-hint {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div class="overlay-panel">
        <h1>Gyeme Maps - Ghana</h1>
        <p>Self-hosted GIS for EV charging infrastructure.</p>

        <div class="control-section">
            <label>Search Places</label>
            <div class="search-container">
                <input type="text" class="search-input" id="search-input" placeholder="Search for a place in Ghana...">
                <div class="search-results" id="search-results"></div>
            </div>
        </div>

        <div class="control-section">
            <label>Map Layers</label>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="layer-stations" checked>
                    Charging Stations
                </label>
                <label>
                    <input type="checkbox" id="layer-service-areas">
                    Service Areas
                </label>
            </div>
        </div>

        <div class="control-section">
            <label>Actions</label>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="centerOnGhana()">Center on Ghana</button>
                <button class="btn btn-secondary" onclick="toggleRoutePanel()">Route</button>
            </div>
        </div>

        <div class="control-section">
            <label>Tile Source</label>
            <span class="status-badge status-vector">Self-hosted Vector Tiles</span>
        </div>
    </div>

    <div class="route-panel" id="route-panel">
        <h3>Route Planner</h3>
        <input type="text" id="route-from" placeholder="From (click map or search)">
        <input type="text" id="route-to" placeholder="To (click map or search)">
        <p class="route-hint">Click the map to set start/end points</p>
        <div class="btn-group">
            <button class="btn btn-primary btn-sm" onclick="calculateRoute()">Get Route</button>
            <button class="btn btn-danger btn-sm" onclick="clearRoute()">Clear</button>
        </div>
        <div class="route-info" id="route-info"></div>
    </div>

    <div class="info-panel">
        <strong>Coordinates:</strong> <span id="coordinates">--</span> |
        <strong>Zoom:</strong> <span id="zoom-level">--</span>
    </div>

    <script>
        // ── Config ──────────────────────────────────────────────────────────────
        const TILESERVER_URL = 'http://localhost:8085';
        const NOMINATIM_URL = 'http://localhost:8082';
        const OSRM_URL = 'http://localhost:5005';

        const GHANA_CENTER = [-1.0232, 7.9465];
        const GHANA_BOUNDS = [[-3.5, 4.5], [1.5, 11.5]];

        const CHARGING_STATIONS = [
            { id: 1, name: 'Gyeme Accra Central', coords: [-0.1870, 5.5560], connectors: ['CCS2', 'CHAdeMO', 'Type2'], power: 150, address: 'Independence Ave, Accra' },
            { id: 2, name: 'Gyeme Kumasi Hub', coords: [-1.6163, 6.6885], connectors: ['CCS2', 'Type2'], power: 100, address: 'Harper Road, Kumasi' },
            { id: 3, name: 'Gyeme Tema Port', coords: [-0.0167, 5.6698], connectors: ['CCS2', 'CHAdeMO'], power: 350, address: 'Harbour Road, Tema' },
            { id: 4, name: 'Gyeme Cape Coast', coords: [-1.2466, 5.1053], connectors: ['CCS2', 'Type2'], power: 50, address: 'Chapel Square, Cape Coast' },
            { id: 5, name: 'Gyeme Takoradi', coords: [-1.7557, 4.8929], connectors: ['CCS2', 'Type2'], power: 75, address: 'Market Circle, Takoradi' }
        ];

        let map;
        let searchMarker = null;
        let routeFromCoords = null;
        let routeToCoords = null;
        let routeClickMode = null; // 'from' or 'to'
        let searchTimeout = null;

        // ── Map Init ────────────────────────────────────────────────────────────
        function initMap() {
            map = new maplibregl.Map({
                container: 'map',
                style: `${TILESERVER_URL}/styles/ghana/style.json`,
                center: GHANA_CENTER,
                zoom: 7
            });

            map.on('error', (e) => console.error('Map error:', e.error));
            map.addControl(new maplibregl.NavigationControl(), 'top-right');
            map.addControl(new maplibregl.ScaleControl(), 'bottom-right');
            map.on('move', updateInfoPanel);

            map.on('load', () => {
                addChargingStations();
                addServiceArea();
                setupLayerToggles();
            });

            map.on('click', (e) => {
                if (routeClickMode === 'from') {
                    routeFromCoords = [e.lngLat.lng, e.lngLat.lat];
                    document.getElementById('route-from').value = `${e.lngLat.lat.toFixed(4)}, ${e.lngLat.lng.toFixed(4)}`;
                    routeClickMode = 'to';
                    document.querySelector('.route-hint').textContent = 'Now click the destination';
                    updateRouteMarkers();
                } else if (routeClickMode === 'to') {
                    routeToCoords = [e.lngLat.lng, e.lngLat.lat];
                    document.getElementById('route-to').value = `${e.lngLat.lat.toFixed(4)}, ${e.lngLat.lng.toFixed(4)}`;
                    routeClickMode = null;
                    document.querySelector('.route-hint').textContent = 'Click "Get Route" to calculate';
                    updateRouteMarkers();
                }
            });

            setupSearch();
        }

        // ── Search (Nominatim) ──────────────────────────────────────────────────
        function setupSearch() {
            const input = document.getElementById('search-input');
            const results = document.getElementById('search-results');

            input.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();
                if (query.length < 3) {
                    results.classList.remove('visible');
                    return;
                }
                searchTimeout = setTimeout(() => searchPlaces(query), 400);
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    results.classList.remove('visible');
                    input.blur();
                }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-container')) {
                    results.classList.remove('visible');
                }
            });
        }

        async function searchPlaces(query) {
            const results = document.getElementById('search-results');
            try {
                const response = await fetch(
                    `${NOMINATIM_URL}/search?q=${encodeURIComponent(query)}&format=json&countrycodes=gh&limit=8&addressdetails=1`
                );
                const data = await response.json();

                if (data.length === 0) {
                    results.innerHTML = '<div class="search-result-item"><span class="result-name">No results found</span></div>';
                    results.classList.add('visible');
                    return;
                }

                results.innerHTML = data.map(place => `
                    <div class="search-result-item" onclick="goToPlace(${place.lon}, ${place.lat}, '${place.display_name.replace(/'/g, "\\'")}')">
                        <div class="result-name">${place.display_name.split(',').slice(0, 2).join(',')}</div>
                        <div class="result-type">${place.type.replace('_', ' ')}</div>
                    </div>
                `).join('');
                results.classList.add('visible');
            } catch (err) {
                results.innerHTML = '<div class="search-result-item"><span class="result-name">Search unavailable</span></div>';
                results.classList.add('visible');
            }
        }

        function goToPlace(lon, lat, name) {
            document.getElementById('search-results').classList.remove('visible');
            document.getElementById('search-input').value = name.split(',').slice(0, 2).join(',');

            if (searchMarker) searchMarker.remove();
            searchMarker = new maplibregl.Marker({ color: '#3b82f6' })
                .setLngLat([lon, lat])
                .setPopup(new maplibregl.Popup().setHTML(`<strong>${name.split(',')[0]}</strong>`))
                .addTo(map);

            map.flyTo({ center: [lon, lat], zoom: 14, duration: 1500 });
            searchMarker.togglePopup();
        }

        // ── Routing (OSRM) ──────────────────────────────────────────────────────
        function toggleRoutePanel() {
            const panel = document.getElementById('route-panel');
            panel.classList.toggle('visible');
            if (panel.classList.contains('visible')) {
                routeClickMode = 'from';
                document.querySelector('.route-hint').textContent = 'Click the map to set the start point';
            } else {
                routeClickMode = null;
            }
        }

        function updateRouteMarkers() {
            if (map.getSource('route-points')) {
                map.removeLayer('route-points-layer');
                map.removeSource('route-points');
            }

            const features = [];
            if (routeFromCoords) {
                features.push({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: routeFromCoords },
                    properties: { label: 'A', color: '#22c55e' }
                });
            }
            if (routeToCoords) {
                features.push({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: routeToCoords },
                    properties: { label: 'B', color: '#ef4444' }
                });
            }

            if (features.length > 0) {
                map.addSource('route-points', {
                    type: 'geojson',
                    data: { type: 'FeatureCollection', features }
                });
                map.addLayer({
                    id: 'route-points-layer',
                    type: 'circle',
                    source: 'route-points',
                    paint: {
                        'circle-radius': 8,
                        'circle-color': ['get', 'color'],
                        'circle-stroke-width': 3,
                        'circle-stroke-color': '#ffffff'
                    }
                });
            }
        }

        async function calculateRoute() {
            if (!routeFromCoords || !routeToCoords) {
                alert('Please set both start and end points by clicking the map.');
                return;
            }

            const infoEl = document.getElementById('route-info');
            infoEl.textContent = 'Calculating route...';
            infoEl.classList.add('visible');

            try {
                const response = await fetch(
                    `${OSRM_URL}/route/v1/driving/${routeFromCoords.join(',')};${routeToCoords.join(',')}?overview=full&geometries=geojson`
                );
                const data = await response.json();

                if (data.routes && data.routes[0]) {
                    const route = data.routes[0];
                    const distance = (route.distance / 1000).toFixed(1);
                    const duration = Math.round(route.duration / 60);
                    const hours = Math.floor(duration / 60);
                    const mins = duration % 60;
                    const timeStr = hours > 0 ? `${hours}h ${mins}m` : `${mins} min`;

                    // Remove existing route line
                    if (map.getSource('route')) {
                        map.removeLayer('route-line');
                        map.removeSource('route');
                    }

                    map.addSource('route', {
                        type: 'geojson',
                        data: { type: 'Feature', geometry: route.geometry }
                    });

                    map.addLayer({
                        id: 'route-line',
                        type: 'line',
                        source: 'route',
                        paint: {
                            'line-color': '#3b82f6',
                            'line-width': 5,
                            'line-opacity': 0.8
                        }
                    }, 'stations-circle');

                    const coords = route.geometry.coordinates;
                    const bounds = coords.reduce((b, c) => b.extend(c), new maplibregl.LngLatBounds(coords[0], coords[0]));
                    map.fitBounds(bounds, { padding: 80 });

                    infoEl.innerHTML = `<strong>${distance} km</strong> &middot; ${timeStr} drive`;
                } else {
                    infoEl.textContent = 'No route found between these points.';
                }
            } catch (err) {
                console.error('Routing error:', err);
                infoEl.textContent = 'Routing service unavailable. Is OSRM running?';
            }
        }

        function clearRoute() {
            if (map.getSource('route')) {
                map.removeLayer('route-line');
                map.removeSource('route');
            }
            if (map.getSource('route-points')) {
                map.removeLayer('route-points-layer');
                map.removeSource('route-points');
            }
            routeFromCoords = null;
            routeToCoords = null;
            routeClickMode = 'from';
            document.getElementById('route-from').value = '';
            document.getElementById('route-to').value = '';
            document.getElementById('route-info').classList.remove('visible');
            document.querySelector('.route-hint').textContent = 'Click the map to set the start point';
        }

        // ── Charging Stations ───────────────────────────────────────────────────
        function addChargingStations() {
            const geojson = {
                type: 'FeatureCollection',
                features: CHARGING_STATIONS.map(s => ({
                    type: 'Feature',
                    geometry: { type: 'Point', coordinates: s.coords },
                    properties: s
                }))
            };

            map.addSource('stations', { type: 'geojson', data: geojson });

            map.addLayer({
                id: 'stations-circle',
                type: 'circle',
                source: 'stations',
                paint: {
                    'circle-radius': ['interpolate', ['linear'], ['zoom'], 5, 8, 12, 14],
                    'circle-color': '#10b981',
                    'circle-stroke-width': 3,
                    'circle-stroke-color': '#ffffff'
                }
            });

            map.addLayer({
                id: 'stations-label',
                type: 'symbol',
                source: 'stations',
                minzoom: 8,
                layout: {
                    'text-field': ['get', 'name'],
                    'text-size': 12,
                    'text-offset': [0, 1.8],
                    'text-anchor': 'top',
                    'text-font': ['Noto Sans Regular']
                },
                paint: {
                    'text-color': '#1a1a1a',
                    'text-halo-color': '#fff',
                    'text-halo-width': 2
                }
            });

            map.on('click', 'stations-circle', (e) => {
                if (routeClickMode) return; // don't popup during route selection
                const p = e.features[0].properties;
                const connectors = JSON.parse(p.connectors);
                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(`
                        <div class="station-popup">
                            <h3>${p.name}</h3>
                            <p>${p.address}</p>
                            <p><strong>Max Power:</strong> ${p.power} kW</p>
                            <div class="connectors">
                                ${connectors.map(c => `<span class="connector-badge">${c}</span>`).join('')}
                            </div>
                        </div>
                    `)
                    .addTo(map);
            });

            map.on('mouseenter', 'stations-circle', () => map.getCanvas().style.cursor = 'pointer');
            map.on('mouseleave', 'stations-circle', () => map.getCanvas().style.cursor = '');
        }

        // ── Service Areas ───────────────────────────────────────────────────────
        function addServiceArea() {
            const serviceArea = {
                type: 'Feature',
                geometry: {
                    type: 'Polygon',
                    coordinates: [[
                        [-0.4, 5.4], [0.2, 5.4], [0.2, 5.8], [-0.4, 5.8], [-0.4, 5.4]
                    ]]
                },
                properties: { name: 'Greater Accra Service Area' }
            };

            map.addSource('service-area', { type: 'geojson', data: serviceArea });

            map.addLayer({
                id: 'service-area-fill',
                type: 'fill',
                source: 'service-area',
                paint: { 'fill-color': '#10b981', 'fill-opacity': 0.1 },
                layout: { visibility: 'none' }
            });

            map.addLayer({
                id: 'service-area-line',
                type: 'line',
                source: 'service-area',
                paint: { 'line-color': '#10b981', 'line-width': 2, 'line-dasharray': [4, 2] },
                layout: { visibility: 'none' }
            });
        }

        // ── Layer Toggles ───────────────────────────────────────────────────────
        function setupLayerToggles() {
            document.getElementById('layer-stations').addEventListener('change', (e) => {
                const v = e.target.checked ? 'visible' : 'none';
                map.setLayoutProperty('stations-circle', 'visibility', v);
                map.setLayoutProperty('stations-label', 'visibility', v);
            });

            document.getElementById('layer-service-areas').addEventListener('change', (e) => {
                const v = e.target.checked ? 'visible' : 'none';
                map.setLayoutProperty('service-area-fill', 'visibility', v);
                map.setLayoutProperty('service-area-line', 'visibility', v);
            });
        }

        // ── Info Panel ──────────────────────────────────────────────────────────
        function updateInfoPanel() {
            const c = map.getCenter();
            document.getElementById('coordinates').textContent = `${c.lat.toFixed(4)}, ${c.lng.toFixed(4)}`;
            document.getElementById('zoom-level').textContent = map.getZoom().toFixed(1);
        }

        function centerOnGhana() {
            map.flyTo({ center: GHANA_CENTER, zoom: 7, duration: 1500 });
        }

        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>

</html>
