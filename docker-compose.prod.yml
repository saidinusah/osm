services:
  # Nginx - Reverse proxy + viewer SPA
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
      - ./viewer:/usr/share/nginx/html:ro
    depends_on:
      tileserver:
        condition: service_started
      osrm:
        condition: service_started
      nominatim:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TileServer GL - Vector tile server
  tileserver:
    image: maptiler/tileserver-gl:latest
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - tiles_data:/data
      - ./styles:/styles
    command: --config /data/config.json

  # OSRM - Routing engine (MLD algorithm)
  osrm:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - osrm_data:/data
    command: osrm-routed --algorithm mld /data/ghana-latest.osrm

  # PostGIS - Spatial database
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easy_maps}
      POSTGRES_USER: ${POSTGRES_USER:-easy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easy} -d ${POSTGRES_DB:-easy_maps}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis - Live vehicle location tracking
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nominatim - Geocoding
  nominatim:
    image: mediagis/nominatim:4.4
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PBF_PATH: /data/ghana-latest.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?NOMINATIM_PASSWORD is required}
    volumes:
      - nominatim_pgdata:/var/lib/postgresql/data
      - osm_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/status.php || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  postgis_data:
  redis_data:
  nginx_cache:
  nominatim_pgdata:
  tiles_data:
  osrm_data:
  osm_data:

networks:
  default:
    name: amev-maps-network
