services:
  # Setup - One-time data pipeline: downloads OSM data, fonts, and builds MBTiles
  setup:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # entrypoint: []
    command: ["/bin/bash", "/app/setup.sh"]
    volumes:
      - osm_data:/app/data
      - tiles_data:/app/tiles
      - styles_data:/app/styles
    restart: "no"

  # Nginx - Reverse proxy + viewer SPA (built from Dockerfile)
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.http.routers.amev-maps.rule=Host(`${DOMAIN:?DOMAIN is required}`)
      - traefik.http.routers.amev-maps.entrypoints=https
      - traefik.http.routers.amev-maps.tls=true
      - traefik.http.routers.amev-maps.tls.certresolver=letsencrypt
      - traefik.http.services.amev-maps.loadbalancer.server.port=80
    depends_on:
      tileserver:
        condition: service_started
      osrm:
        condition: service_started
      nominatim:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # TileServer GL - Vector tile server
  tileserver:
    image: maptiler/tileserver-gl:latest
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - tiles_data:/data
      - ./tiles/config.json:/data/config.json:ro
      - styles_data:/styles
    command: --config /data/config.json
    depends_on:
      setup:
        condition: service_completed_successfully

  # OSRM - Routing engine (MLD algorithm)
  osrm:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - osrm_data:/data
    command: osrm-routed --algorithm mld /data/ghana-latest.osrm

  # PostGIS - Spatial database
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easy_maps}
      POSTGRES_USER: ${POSTGRES_USER:-easy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    entrypoint:
      - sh
      - -c
      - |
        cp /scripts/init-db.sql /docker-entrypoint-initdb.d/init.sql
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easy} -d ${POSTGRES_DB:-easy_maps}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis - Live vehicle location tracking
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nominatim - Geocoding
  nominatim:
    image: mediagis/nominatim:4.4
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PBF_PATH: /data/ghana-latest.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:?NOMINATIM_PASSWORD is required}
    volumes:
      - nominatim_pgdata:/var/lib/postgresql/data
      - osm_data:/data
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/status.php || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  postgis_data:
  redis_data:
  nominatim_pgdata:
  tiles_data:
  osrm_data:
  osm_data:
  styles_data:

networks:
  default:
    name: amev-maps-network
  coolify:
    external: true
    name: coolify
