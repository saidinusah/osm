services:
  # Setup - One-time data pipeline: downloads OSM PBF, fonts, and builds MBTiles.
  setup:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["/bin/bash", "/app/setup.sh"]
    volumes:
      - osm_data:/app/data
      - tiles_data:/app/tiles
      - styles_data:/app/styles
    restart: "no"

  # Setup OSRM - One-time OSRM graph preparation (extract → partition → customize).
  # Reads the PBF from the `setup` service, writes the prepared graph into osrm_data.
  # Idempotent: skips if the graph files already exist.
  osrm-setup:
    image: osrm/osrm-backend:latest
    entrypoint: /bin/sh
    command: ["-c", "/scripts/setup-osrm.sh"]
    volumes:
      - osm_data:/input:ro
      - osrm_data:/data
      - ./docker/setup-osrm.sh:/scripts/setup-osrm.sh:ro
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: "no"

  # Nginx - Reverse proxy + viewer SPA (built from Dockerfile).
  # Exposed to Coolify's Traefik via labels + the shared `coolify` network.
  # Traefik (already running on this box) handles TLS via Let's Encrypt.
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    expose:
      - "80"
    environment:
      MAPS_INTERNAL_API_KEY: ${MAPS_INTERNAL_API_KEY:-test}
      TILES_CORS_ORIGIN: ${TILES_CORS_ORIGIN:-*}
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.amev-maps.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.amev-maps.entrypoints=https
      - traefik.http.routers.amev-maps.tls=true
      - traefik.http.routers.amev-maps.tls.certresolver=letsencrypt
      - traefik.http.services.amev-maps.loadbalancer.server.port=80
      # Redirect plain HTTP → HTTPS
      - traefik.http.routers.amev-maps-http.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.amev-maps-http.entrypoints=http
      - traefik.http.routers.amev-maps-http.middlewares=amev-maps-redirect
      - traefik.http.middlewares.amev-maps-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.amev-maps-redirect.redirectscheme.permanent=true
    depends_on:
      tileserver:
        condition: service_started
      osrm:
        condition: service_started
      nominatim:
        condition: service_started
    healthcheck:
      # nginx:alpine ships busybox wget
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # TileServer GL - Vector tile server
  tileserver:
    image: maptiler/tileserver-gl:latest
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - tiles_data:/data
      - ./tiles/config.json:/data/config.json:ro
      - styles_data:/styles
    command: --config /data/config.json
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      # Bash /dev/tcp avoids assuming wget/curl is installed in the upstream image
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # OSRM - Routing engine (MLD algorithm). Waits for osrm-setup to prepare the graph.
  osrm:
    image: osrm/osrm-backend:latest
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - osrm_data:/data
    command: osrm-routed --algorithm mld /data/ghana-latest.osrm
    depends_on:
      osrm-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/5000'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # PostGIS - Spatial database
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easy_maps}
      POSTGRES_USER: ${POSTGRES_USER:-easy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./scripts:/scripts:ro
    entrypoint:
      - sh
      - -c
      - |
        cp /scripts/init-db.sql /docker-entrypoint-initdb.d/init.sql
        exec docker-entrypoint.sh postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easy} -d ${POSTGRES_DB:-easy_maps}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis - Live vehicle location tracking
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-test}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nominatim - Geocoding. First boot indexes the Ghana extract; can take 30–60 minutes
  # so start_period is long enough to avoid spurious unhealthy markings.
  nominatim:
    image: mediagis/nominatim:4.4
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      PBF_PATH: /data/ghana-latest.osm.pbf
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD:-test}
    volumes:
      - nominatim_pgdata:/var/lib/postgresql/data
      - osm_data:/data
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/status.php || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 3600s

volumes:
  postgis_data:
  redis_data:
  nominatim_pgdata:
  tiles_data:
  osrm_data:
  osm_data:
  styles_data:

networks:
  default:
    name: amev-maps-network
  # Shared with Coolify's Traefik so it can route to nginx.
  coolify:
    external: true
    name: coolify
