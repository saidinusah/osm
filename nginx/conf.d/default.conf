server {
    listen 80;
    server_name _;

    # Gzip compression
    gzip on;
    gzip_types application/json application/javascript text/css text/html application/x-protobuf application/vnd.mapbox-vector-tile;
    gzip_min_length 256;

    # Root for static files (viewer)
    root /usr/share/nginx/html;
    index index.html;

    # Main viewer page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # TileServer GL - vector tiles
    location /tiles/ {
        proxy_pass http://tileserver:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache tiles aggressively
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # OSRM - routing
    location /routing/ {
        proxy_pass http://osrm:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nominatim - geocoding
    location /geocode/ {
        proxy_pass http://nominatim:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
