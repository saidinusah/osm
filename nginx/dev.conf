server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_types application/json application/javascript text/css text/html;
    gzip_min_length 256;

    # Root for static files (viewer)
    root /usr/share/nginx/html;
    index index.html;

    # Main viewer page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to TileServer GL
    location /tiles/ {
        proxy_pass http://easy-tileserver:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy to OSRM
    location /route/ {
        proxy_pass http://easy-osrm:5000/route/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy to Nominatim
    location /nominatim/ {
        proxy_pass http://easy-nominatim:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
